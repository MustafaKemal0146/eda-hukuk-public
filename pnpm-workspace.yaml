    next: 16.4.0
    react: 19.3.0
    react-dom: 19.3.0
  # Yalnız MIT eklentiler; @tiptap-pro/* YASAK (011, Y-110). Hepsi aynı tam sürüm.
  tiptap:
    "@tiptap/core": 3.31.4
    "@tiptap/extension-table": 3.31.4
    "@tiptap/extension-unique-id": 3.31.4
    "@tiptap/pm": 3.31.4
    "@tiptap/react": 3.31.4
    "@tiptap/starter-kit": 3.31.4

# Güvenlik ve tutarlılık (anahtar adları pnpm 11.28.5 ile doğrulandı)
minimumReleaseAge: 1440
catalogMode: strict
saveExact: true
engineStrict: true
# Derleme betikleri varsayılan kapalı (013 §14 kural 5). Bu paketler önceden derlenmiş ikili ile gelir;
# next-intl çıkarıcısının isteğe bağlı bağımlılıklarıdır, çalışma zamanında kullanılmaz.
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  # drizzle-kit (yalnız geliştirme aracı, migrasyon dosyası üretir): esbuild ikilisi platform
  # paketinden (@esbuild/linux-*) gelir; kurulum betiği gerekmez (P03a).
  esbuild: false
  # bullmq -> msgpackr isteğe bağlı yerel hızlandırıcısı: ikili @msgpackr-extract/* platform
  # paketinden gelir, yoksa msgpackr saf JS yoluna düşer; kurulum betiği gerekmez (P03c).
  msgpackr-extract: false
