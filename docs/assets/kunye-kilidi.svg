<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Künye Kilidi: model yalnız etiket yazar, künye kayıttan oluşur ve resmî kaynakta doğrulanır"><style>text{font-family:'Hanken Grotesk','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}</style><rect x="1" y="1" width="1198" height="248" rx="14" fill="#f5f6f8" stroke="#e3e6ec" stroke-width="2"/><rect x="40" y="34" width="352" height="182" rx="12" fill="#ffffff" stroke="#e3e6ec" stroke-width="1.5"/><text x="64" y="66" font-size="11.5" font-weight="700" letter-spacing=".08em" fill="#5b6472">YAPAY ZEKÂ</text><text x="64" y="96" font-size="19" font-weight="700" fill="#141821">Yalnız etiket yazar</text><rect x="64" y="112" width="304" height="34" rx="8" fill="#e9edfb"/><text x="78" y="134" font-size="13.5" font-weight="600" fill="#1f3fc4">“…feshedebilirsiniz [K1]”</text><text x="64" y="174" font-size="13" fill="#5b6472">Mahkeme adı, esas ya da karar</text><text x="64" y="193" font-size="13" fill="#5b6472">numarası yazamaz.</text><path d="M398 125 h20 m-6 -6 l6 6 l-6 6" fill="none" stroke="#5b6472" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="424" y="34" width="352" height="182" rx="12" fill="#ffffff" stroke="#e3e6ec" stroke-width="1.5"/><text x="448" y="66" font-size="11.5" font-weight="700" letter-spacing=".08em" fill="#5b6472">KAYIT</text><text x="448" y="96" font-size="19" font-weight="700" fill="#141821">Künye kayıttan oluşur</text><rect x="448" y="112" width="304" height="34" rx="8" fill="#e9edfb"/><text x="462" y="134" font-size="13.5" font-weight="600" fill="#1f3fc4">Daire · Esas · Karar · Tarih</text><text x="448" y="174" font-size="13" fill="#5b6472">Etiketin karşılığı, bulunan</text><text x="448" y="193" font-size="13" fill="#5b6472">kaynağın kendi kaydıdır.</text><path d="M782 125 h20 m-6 -6 l6 6 l-6 6" fill="none" stroke="#5b6472" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="808" y="34" width="352" height="182" rx="12" fill="#ffffff" stroke="#1f7a4d" stroke-width="2"/><text x="832" y="66" font-size="11.5" font-weight="700" letter-spacing=".08em" fill="#1f7a4d">RESMÎ KAYNAK</text><text x="832" y="96" font-size="19" font-weight="700" fill="#141821">Kaynakta doğrulanır</text><rect x="832" y="112" width="304" height="34" rx="8" fill="#e4f3ea"/><text x="846" y="134" font-size="13.5" font-weight="600" fill="#1f7a4d">Eşleşti: doğrulandı</text><text x="832" y="174" font-size="13" fill="#5b6472">Tutmazsa atıf işaretlenir,</text><text x="832" y="193" font-size="13" fill="#5b6472">avukat uyarılır.</text></svg>