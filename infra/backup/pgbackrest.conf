# infra/backup/pgbackrest.conf (073 §4.2)
# Sır (repo1-cipher-pass) bu dosyada değil: entrypoint.sh /run/eda/pgbackrest.d/secret.conf yazar ve
# PGBACKREST_CONFIG_INCLUDE_PATH ile yükletir (config-include-path dosyada geçersizdir).
[global]
log-path=/tmp/pgbackrest/log
lock-path=/tmp/pgbackrest/lock
repo1-path=/var/lib/pgbackrest
repo1-type=posix
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=count
repo1-retention-full=5
repo1-retention-archive-type=full
repo1-retention-archive=2
repo1-bundle=y
repo1-block=y
compress-type=zst
compress-level=3
process-max=2
start-fast=y
delta=y
backup-standby=n
archive-timeout=60
tls-server-address=*
tls-server-port=8432
tls-server-ca-file=/run/secrets/pgbackrest_ca_crt
tls-server-cert-file=/run/secrets/pgbackrest_repo_crt
tls-server-key-file=/tmp/pgbackrest/pgbackrest_repo_key
tls-server-auth=postgres=eda

[eda]
pg1-host=postgres
pg1-host-type=tls
pg1-host-port=8432
pg1-host-ca-file=/run/secrets/pgbackrest_ca_crt
pg1-host-cert-file=/run/secrets/pgbackrest_repo_crt
pg1-host-key-file=/tmp/pgbackrest/pgbackrest_repo_key
pg1-path=/var/lib/postgresql/18/docker
