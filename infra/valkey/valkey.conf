# valkey: kuyruk (BullMQ), hız sınırı, oturum (014 §3.7). Veri kaybı kabul edilmez: noeviction + AOF.
bind 0.0.0.0
protected-mode yes
port 6379
# ACL dosyası giriş betiğince sırlardan /run/eda'ya üretilir; bu dosyada `user` satırı yazılamaz.
aclfile /run/eda/users.acl
dir /data
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
save ""
# maxmemory komut satırından verilir (compose: 1gb, beta 768mb).
maxmemory-policy noeviction
tcp-keepalive 60
