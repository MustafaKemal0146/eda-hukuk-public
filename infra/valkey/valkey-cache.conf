# valkey-cache: kaynak önbelleği, tek uçuş, devre kesici, token kovaları (014 §3.7). Kalıcılık yok.
bind 0.0.0.0
protected-mode yes
port 6379
aclfile /run/eda/users.acl
dir /tmp
appendonly no
save ""
# maxmemory komut satırından verilir (compose: 512mb, beta 384mb).
maxmemory-policy allkeys-lru
tcp-keepalive 60
