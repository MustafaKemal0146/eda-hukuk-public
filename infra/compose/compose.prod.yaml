# E.D.A. Hukuk — üretim katmanı (070 §7).
# Y-108: her image: satırı "@sha256:" içerir; "latest" yok.
x-restart: &restart { restart: unless-stopped }
x-eda-env: &eda-env { EDA_ENV: production }

services:
  caddy:        { <<: *restart, image: "ghcr.io/mustafakemal0146/eda-hukuk-final/caddy@sha256:${EDA_DIGEST_CADDY:?}",   mem_limit: 256m, memswap_limit: 256m, cpus: 0.5,  pids_limit: 256, ports: ["80:80", "443:443"] }
  web:          { <<: *restart, image: "ghcr.io/mustafakemal0146/eda-hukuk-final/web@sha256:${EDA_DIGEST_WEB:?}",       mem_limit: 768m, memswap_limit: 768m, cpus: 1,    pids_limit: 256, environment: *eda-env }
  admin:        { <<: *restart, image: "ghcr.io/mustafakemal0146/eda-hukuk-final/admin@sha256:${EDA_DIGEST_ADMIN:?}",   mem_limit: 512m, memswap_limit: 512m, cpus: 0.5,  pids_limit: 256, environment: *eda-env }
  api:          { <<: *restart, image: "ghcr.io/mustafakemal0146/eda-hukuk-final/api@sha256:${EDA_DIGEST_API:?}",       mem_limit: 1g,   memswap_limit: 1g,   cpus: 2,    pids_limit: 512, environment: *eda-env }
  worker:       { <<: *restart, image: "ghcr.io/mustafakemal0146/eda-hukuk-final/worker@sha256:${EDA_DIGEST_WORKER:?}", mem_limit: 1536m, memswap_limit: 1536m, cpus: 2,  pids_limit: 512, environment: *eda-env }
  jobs:         { <<: *restart, image: "ghcr.io/mustafakemal0146/eda-hukuk-final/worker@sha256:${EDA_DIGEST_WORKER:?}", mem_limit: 512m, memswap_limit: 512m, cpus: 0.5,  pids_limit: 256, environment: *eda-env }
  migrate:      {               image: "ghcr.io/mustafakemal0146/eda-hukuk-final/migrate@sha256:${EDA_DIGEST_MIGRATE:?}", mem_limit: 256m, memswap_limit: 256m, cpus: 0.5,  pids_limit: 128, environment: *eda-env }
  yargi-mcp:    { <<: *restart, image: "ghcr.io/mustafakemal0146/eda-hukuk-final/yargi-mcp@sha256:${EDA_DIGEST_YARGI_MCP:?}", mem_limit: 384m, memswap_limit: 384m, cpus: 0.5, pids_limit: 256, environment: *eda-env }
  doc-engine:   { <<: *restart, image: "ghcr.io/mustafakemal0146/eda-hukuk-final/doc-engine@sha256:${EDA_DIGEST_DOC_ENGINE:?}", mem_limit: 5g, memswap_limit: 5g, cpus: 2, pids_limit: 1024, environment: *eda-env }
  gotenberg:    { <<: *restart, image: "gotenberg/gotenberg:8.37.0@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769", mem_limit: 1536m, memswap_limit: 1536m, cpus: 1, pids_limit: 512 }
  postgres:     { <<: *restart, image: "ghcr.io/mustafakemal0146/eda-hukuk-final/postgres@sha256:${EDA_DIGEST_POSTGRES:?}", mem_limit: 20g, memswap_limit: 20g, cpus: 4, pids_limit: 512 }
  valkey:       { <<: *restart, image: "valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11", mem_limit: 1536m, memswap_limit: 1536m, cpus: 0.5, pids_limit: 128 }
  valkey-cache: { <<: *restart, image: "valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11", mem_limit: 768m,  memswap_limit: 768m,  cpus: 0.25, pids_limit: 128 }
  objstore:     { <<: *restart, image: "ghcr.io/mustafakemal0146/eda-hukuk-final/objstore@sha256:${EDA_DIGEST_OBJSTORE:?}", mem_limit: 1g, memswap_limit: 1g, cpus: 1, pids_limit: 1024 }
  embed-query:  { <<: *restart, image: "ghcr.io/mustafakemal0146/eda-hukuk-final/embed@sha256:${EDA_DIGEST_EMBED:?}", mem_limit: 3g, memswap_limit: 3g, cpus: 1.5, pids_limit: 256 }
  embed-batch:  { <<: *restart, image: "ghcr.io/mustafakemal0146/eda-hukuk-final/embed@sha256:${EDA_DIGEST_EMBED:?}", mem_limit: 3g, memswap_limit: 3g, cpus: 2,   pids_limit: 256 }
  rerank:       { <<: *restart, image: "ghcr.io/mustafakemal0146/eda-hukuk-final/rerank@sha256:${EDA_DIGEST_RERANK:?}", mem_limit: 2g, memswap_limit: 2g, pids_limit: 256 }
  clamav:       { <<: *restart, image: "clamav/clamav:1.4@sha256:57deb108fc4c72778aa83eafbca7bb7153e28c3f57c005afd38d31f16da86f23", mem_limit: 2g,   memswap_limit: 2g,   cpus: 1,    pids_limit: 128 }
  freshclam:    { <<: *restart, image: "clamav/clamav:1.4@sha256:57deb108fc4c72778aa83eafbca7bb7153e28c3f57c005afd38d31f16da86f23", mem_limit: 256m, memswap_limit: 256m, cpus: 0.25, pids_limit: 64 }
  egress-llm:    { <<: *restart, image: "ghcr.io/mustafakemal0146/eda-hukuk-final/egress@sha256:${EDA_DIGEST_EGRESS:?}", mem_limit: 64m, memswap_limit: 64m, cpus: 0.25, pids_limit: 128 }
  egress-portal: { <<: *restart, image: "ghcr.io/mustafakemal0146/eda-hukuk-final/egress@sha256:${EDA_DIGEST_EGRESS:?}", mem_limit: 64m, memswap_limit: 64m, cpus: 0.25, pids_limit: 128 }
  egress-backup: { <<: *restart, image: "ghcr.io/mustafakemal0146/eda-hukuk-final/egress@sha256:${EDA_DIGEST_EGRESS:?}", mem_limit: 64m, memswap_limit: 64m, cpus: 0.25, pids_limit: 128 }
  egress-av:     { <<: *restart, image: "ghcr.io/mustafakemal0146/eda-hukuk-final/egress@sha256:${EDA_DIGEST_EGRESS:?}", mem_limit: 64m, memswap_limit: 64m, cpus: 0.25, pids_limit: 128 }
  backup:       { <<: *restart, image: "ghcr.io/mustafakemal0146/eda-hukuk-final/backup@sha256:${EDA_DIGEST_BACKUP:?}", mem_limit: 512m, memswap_limit: 512m, cpus: 1, pids_limit: 256 }

volumes:
  pgdata:      { driver: local, driver_opts: { type: none, o: bind, device: /srv/eda/nvme1/pgdata } }
  valkeydata:  { driver: local, driver_opts: { type: none, o: bind, device: /srv/eda/nvme1/valkeydata } }
  caddydata:   { driver: local, driver_opts: { type: none, o: bind, device: /srv/eda/nvme1/caddydata } }
  caddyconfig: { driver: local, driver_opts: { type: none, o: bind, device: /srv/eda/nvme1/caddyconfig } }
  clamavdb:    { driver: local, driver_opts: { type: none, o: bind, device: /srv/eda/nvme1/clamavdb } }
  objdata:     { driver: local, driver_opts: { type: none, o: bind, device: /srv/eda/nvme2/objdata } }
  pgbackrest:  { driver: local, driver_opts: { type: none, o: bind, device: /srv/eda/nvme2/pgbackrest } }
