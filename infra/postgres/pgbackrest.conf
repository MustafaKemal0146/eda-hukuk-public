# infra/postgres/pgbackrest.conf (073 §4.2)
[global]
log-path=/tmp/pgbackrest/log
lock-path=/tmp/pgbackrest/lock
spool-path=/tmp/pgbackrest/spool
archive-async=y
archive-push-queue-max=50GiB
repo1-host=backup
repo1-host-type=tls
repo1-host-port=8432
repo1-host-ca-file=/run/secrets/pgbackrest_ca_crt
repo1-host-cert-file=/run/secrets/pgbackrest_pg_crt
repo1-host-key-file=/tmp/pgbackrest/pgbackrest_pg_key
tls-server-address=*
tls-server-port=8432
tls-server-ca-file=/run/secrets/pgbackrest_ca_crt
tls-server-cert-file=/run/secrets/pgbackrest_pg_crt
tls-server-key-file=/tmp/pgbackrest/pgbackrest_pg_key
tls-server-auth=eda-backup-repo=eda

[eda]
pg1-path=/var/lib/postgresql/18/docker
pg1-user=eda_backup
pg1-database=eda
pg1-socket-path=/var/run/postgresql
