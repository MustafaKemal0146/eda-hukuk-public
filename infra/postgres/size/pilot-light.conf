# PostgreSQL boyut anahtarları — pilot hafif mod (mem_limit 1792m) (070 §14.3). compose: PG_SIZE_CONF -> /etc/postgresql/size.conf:ro
# postgresql.conf'un sonunda include edilir; buradaki değerler öncekileri ezer.
shared_buffers = 512MB
effective_cache_size = 1GB
work_mem = 4MB
maintenance_work_mem = 128MB
max_connections = 50                  # bütçe: api 28 + worker 10 + jobs ~3 + migrate 1 + yönetim payı
max_wal_size = 2GB                    # küçük disk: arşiv gecikmesinde pg_wal tamponu (073 §4.1) izlenmeli
