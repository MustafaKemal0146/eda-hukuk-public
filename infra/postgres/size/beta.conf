# PostgreSQL boyut anahtarları — beta (mem_limit 8g) (070 §14.3). compose: PG_SIZE_CONF -> /etc/postgresql/size.conf:ro
# postgresql.conf'un sonunda include edilir; buradaki değerler öncekileri ezer.
shared_buffers = 2GB
effective_cache_size = 5GB
work_mem = 8MB
maintenance_work_mem = 256MB
max_connections = 60                  # bütçe: api 28 + worker 10 + jobs ~3 + migrate 1 + yönetim payı
max_wal_size = 4GB                     # 073 §4.1: arşiv gecikmesinde pg_wal tamponu
