# PostgreSQL boyut anahtarları — prod (mem_limit 20g) (070 §14.3). compose: PG_SIZE_CONF -> /etc/postgresql/size.conf:ro
# postgresql.conf'un sonunda include edilir; buradaki değerler öncekileri ezer.
shared_buffers = 5GB
effective_cache_size = 12GB
work_mem = 16MB
maintenance_work_mem = 512MB
max_connections = 100                  # bütçe: api 28 + worker 10 + jobs ~3 + migrate 1 + yönetim payı
max_wal_size = 8GB                     # 073 §4.1: arşiv gecikmesinde pg_wal tamponu
# HNSW kurulumunda bakım penceresinde oturum düzeyinde: SET maintenance_work_mem='5GB'; max_parallel_maintenance_workers=4
