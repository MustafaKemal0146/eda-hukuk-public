# PostgreSQL boyut anahtarları — dev (mem_limit 4g) (070 §14.3). compose: PG_SIZE_CONF -> /etc/postgresql/size.conf:ro
# postgresql.conf'un sonunda include edilir; buradaki değerler öncekileri ezer.
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB
max_connections = 60                  # bütçe: api 28 + worker 10 + jobs ~3 + migrate 1 + yönetim payı
max_wal_size = 1GB                     # 073 §4.1: arşiv gecikmesinde pg_wal tamponu

# AS önerisi: dev'de backup sunucusu/stanza yok; archive_mode=on sürekli archive-push hatası üretir.
# archive_mode yalnız sunucu yeniden başlatılınca değişir; dev'de kapalı tutulur.
archive_mode = off
