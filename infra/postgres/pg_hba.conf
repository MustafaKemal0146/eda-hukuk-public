# E.D.A. Hukuk — istemci kimlik doğrulama (031 §2.6, 070 §10.2).
# Kural: yalnız scram-sha-256; trust ve md5 YASAK. postgres süper kullanıcısı ağdan bağlanamaz.
# İlk eşleşen satır uygulanır; listede olmayan her şey sondaki reject satırlarıyla reddedilir.
# TYPE  DATABASE  USER                                                                            ADDRESS    METHOD
local   all       postgres                                                                                   peer
local   eda       eda_backup                                                                                 scram-sha-256
host    eda       eda_owner,eda_auth,eda_app,eda_worker,eda_jobs,eda_readonly_admin,eda_monitor   samenet    scram-sha-256
host    all       all                                                                             0.0.0.0/0  reject
host    all       all                                                                             ::/0       reject
