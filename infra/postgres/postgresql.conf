# E.D.A. Hukuk — PostgreSQL 18 ana yapılandırması (070 §10.2 + 073 §4.1).
# Boyut anahtarları (shared_buffers, work_mem, max_connections …) size.conf'tadır (070 §14.3);
# include_if_exists en sonda olduğundan size.conf buradaki değerleri ezebilir.
# Veri dizini PGDATA ortamından gelir: /var/lib/postgresql/18/docker (PG18 resmî imaj).

# --- Bağlantı ---
listen_addresses = '*'                       # yalnız data ağı; port yayınlanmaz (dev hariç, 127.0.0.1)
port = 5432
unix_socket_directories = '/var/run/postgresql'   # tmpfs (uid 999)
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = scram-sha-256          # md5 parolası üretilmez
ssl = off                                    # iç ağ; TLS pgBackRest kanalında (073)

# --- Eklentiler ---
shared_preload_libraries = 'pg_stat_statements,pg_textsearch'
pg_stat_statements.track = top

# --- G/Ç ve planlayıcı ---
io_method = worker                           # io_uring Docker seccomp'unda engelli olabilir; seccomp gevşetilmez
random_page_cost = 1.1                       # SSD

# --- WAL ve arşiv (073 §4.1) ---
wal_level = replica
wal_compression = zstd
wal_keep_size = 0                            # çoğaltma yok
archive_mode = on                            # dev.conf'ta off (yedek sunucusu yok)
archive_command = 'pgbackrest --stanza=eda archive-push %p'   # stanza-create öncesi hatalar beklenir (073)
archive_timeout = 120s                       # RPO bileşeni
# max_wal_size boyut dosyasındadır (prod 8GB / beta 4GB)

# --- Yerel ayar ve FTS ---
timezone = 'UTC'
log_timezone = 'UTC'
default_text_search_config = 'public.tr_hukuk'   # 040-text-search.sql oluşturur

# --- Günlük (stderr → Docker log sürücüsü) ---
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
log_connections = 'authentication'           # başarısız kimlik denemeleri görünür (PG18 biçimi)
log_min_duration_statement = 1000            # 1 sn üstü sorgular

# --- Boyut anahtarları (en sonda) ---
include_if_exists = '/etc/postgresql/size.conf'
